<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENG1 Group 9</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #f8f9fa;
            color: #212529;
        }

        header {
            margin-bottom: 24px;
        }

        /* Navigation Menu */
        .menu-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .folder-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .folder-btn:hover {
            background-color: #0056b3;
        }

        /* Gallery Container */
        .folder-content {
            display: none; 
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .folder-content.show {
            display: block; 
        }

        .folder-title {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 20px;
        }

        /* Image Grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .image-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            background-color: #fff;
        }

        .image-card a {
            display: block;
            text-decoration: none;
        }

        .image-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            transition: opacity 0.2s ease;
        }

        .image-card img:hover {
            opacity: 0.85;
        }

        .image-card span {
            display: block;
            padding: 8px 12px;
            font-size: 13px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>ENG1 Group 9</h1>
    </header>

    <!-- Folder Selection Menu -->
    <nav class="menu-bar">
        <button class="folder-btn" onclick="toggleFolder('architecture-folder')">
            📁 Architecture
        </button>
    </nav>

    <!-- Architecture Folder Content -->
    <div id="architecture-folder" class="folder-content">
        <h2 class="folder-title">Concepts and Early Iterations / Architecture</h2>
        <div class="image-grid">
            <div class="image-card">
                <a href="Concepts%20and%20Early%20Iterations/Architecture/Copy%20of%20ENG1%20Group%209%20UML%20-%20Page%201.png" target="_blank">
                    <img src="Concepts%20and%20Early%20Iterations/Architecture/Copy%20of%20ENG1%20Group%209%20UML%20-%20Page%201.png" alt="Copy of ENG1 Group 9 UML - Page 1">
                </a>
                <span>Copy of ENG1 Group 9 UML - Page 1</span>
            </div>
            <div class="image-card">
                <a href="Concepts%20and%20Early%20Iterations/Architecture/ENG1%20Group%209%20UML%20-%20Page%201.png" target="_blank">
                    <img src="Concepts%20and%20Early%20Iterations/Architecture/ENG1%20Group%209%20UML%20-%20Page%201.png" alt="ENG1 Group 9 UML - Page 1">
                </a>
                <span>ENG1 Group 9 UML - Page 1</span>
            </div>
            <div class="image-card">
                <a href="Concepts%20and%20Early%20Iterations/Architecture/GROUP-PROJECT%20UML%20DRAFT.png" target="_blank">
                    <img src="Concepts%20and%20Early%20Iterations/Architecture/GROUP-PROJECT%20UML%20DRAFT.png" alt="GROUP-PROJECT UML DRAFT">
                </a>
                <span>GROUP-PROJECT UML DRAFT</span>
            </div>
            <div class="image-card">
                <a href="Concepts%20and%20Early%20Iterations/Architecture/Screenshot%202026-11-11%20191636.png" target="_blank">
                    <img src="Concepts%20and%20Early%20Iterations/Architecture/Screenshot%202026-11-11%20191636.png" alt="Screenshot 2026-11-11 191636">
                </a>
                <span>Screenshot 2026-11-11 191636</span>
            </div>
            <div class="image-card">
                <a href="Concepts%20and%20Early%20Iterations/Architecture/Screenshot%202026-11-11%20191758.png" target="_blank">
                    <img src="Concepts%20and%20Early%20Iterations/Architecture/Screenshot%202026-11-11%20191758.png" alt="Screenshot 2026-11-11 191758">
                </a>
                <span>Screenshot 2026-11-11 191758</span>
            </div>
            <div class="image-card">
                <a href="Concepts%20and%20Early%20Iterations/Architecture/UML-1.jpg" target="_blank">
                    <img src="Concepts%20and%20Early%20Iterations/Architecture/UML-1.jpg" alt="UML-1">

            </div>
        </div>
    </div>

    <script>
        function toggleFolder(folderId) {
            const folder = document.getElementById(folderId);
            const isShowing = folder.classList.toggle('show');
            
            // Update URL hash without reloading the page
            if (isShowing) {
                history.pushState(null, null, '#' + folderId);
            } else {
                history.pushState(null, null, window.location.pathname);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);
            if (hash) {
                const targetFolder = document.getElementById(hash);
                if (targetFolder) {
                    targetFolder.classList.add('show');
                }
            }
        });
    </script>

</body>
</html>
