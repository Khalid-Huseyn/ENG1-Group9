<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goozers — Play & Download</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #94a3b8;
      font-size: 1.1rem;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #e2e8f0;
    }

    .game-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #020617;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .game-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .btn {
      display: inline-block;
      background-color: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    .hint {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    code {
      background-color: #0f172a;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #38bdf8;
    }

    ul {
      padding-left: 1.25rem;
      color: #cbd5e1;
    }

    li {
      margin-bottom: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Goozers</h1>
      <p>Play in your browser or download the desktop version</p>
    </header>

    <!-- Browser Playable Section (Requires LibGDX HTML/TeaVM web build) -->
    <section class="card">
      <h2>Play in Browser</h2>
      <div class="game-wrapper">
        <iframe
          src="game/index.html"
          title="Goozers Web Game"
          allowfullscreen
        ></iframe>
      </div>
    </section>

    <!-- Desktop JAR Download Section -->
    <section class="card">
      <h2>Download Desktop Version</h2>
      <div class="actions">
        <div>
          <p class="hint">
            Requires Java 17+ installed. Run via double-click or
            <code>java -jar Goozers.jar</code>
          </p>
        </div>
        <a href="downloads/goozers.jar" download="Goozers.jar" class="btn">
          Download Goozers.jar
        </a>
      </div>
    </section>

    <!-- Controls / About -->
    <section class="card">
      <h2>Controls &amp; Info</h2>
      <ul>
        <li><strong>Move:</strong> W A S D / Arrow Keys</li>
        <li><strong>Interact / Action:</strong> E / Space</li>
        <li><strong>Pause:</strong> Esc</li>
      </ul>
    </section>
  </div>
</body>
</html>
