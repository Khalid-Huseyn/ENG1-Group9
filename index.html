<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENG1 Group 9 — GooseGo! (Goose Patrol)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #f8f9fa;
            color: #212529;
            line-height: 1.55;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            margin: 0 0 6px 0;
            font-size: 28px;
        }

        .team-meta {
            margin: 0;
            color: #495057;
            font-size: 14px;
        }

        .section-heading {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 14px;
            color: #212529;
        }

        .section-divider {
            border: 0;
            border-top: 2px solid #dee2e6;
            margin: 32px 0;
        }

        /* Navigation Menu */
        .menu-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .folder-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .folder-btn:hover,
        .folder-btn.active {
            background-color: #0056b3;
        }

        /* Folder Content Container */
        .folder-content {
            display: none;
            background-color: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .folder-content.show {
            display: block;
        }

        .folder-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        .folder-title {
            margin: 0;
            font-size: 21px;
        }

        .doc-section {
            margin-bottom: 26px;
        }

        .doc-section h4 {
            margin: 0 0 10px 0;
            font-size: 17px;
            color: #0056b3;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }

        .doc-section p,
        .doc-section ul,
        .doc-section ol {
            margin: 0 0 12px 0;
            font-size: 14px;
        }

        .doc-section li {
            margin-bottom: 6px;
        }

        code {
            background-color: #f1f3f5;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 13px;
        }

        /* Action Buttons inside Deliverables */
        .file-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 15px;
            background-color: #e7f1ff;
            border: 1px solid #b6d4fe;
            border-radius: 6px;
            color: #0056b3;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .file-link:hover {
            background-color: #cfe2ff;
            border-color: #9ec5fe;
        }

        .pdf-embed-box {
            display: none;
            margin-bottom: 22px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .pdf-embed-box.show {
            display: block;
        }

        .pdf-embed-box iframe {
            width: 100%;
            height: 620px;
            border: none;
            display: block;
        }

        /* Data Tables */
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            background-color: #fff;
        }

        th, td {
            border: 1px solid #dee2e6;
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #f1f3f5;
            font-weight: 600;
            color: #212529;
        }

        tr:nth-child(even) td {
            background-color: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-a1 {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .badge-a2 {
            background-color: #fff3cd;
            color: #664d03;
        }

        .badge-moderate {
            background-color: #fff3cd;
            color: #664d03;
        }

        .badge-serious {
            background-color: #f8d7da;
            color: #842029;
        }

        .ref-list {
            font-size: 13px;
            color: #495057;
            padding-left: 20px;
        }

        .ref-list li {
            margin-bottom: 6px;
        }

        /* Image Grid */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .image-card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            background-color: #fff;
        }

        .image-card a {
            display: block;
            text-decoration: none;
        }

        .image-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            transition: opacity 0.2s ease;
        }

        .image-card img:hover {
            opacity: 0.85;
        }

        .image-card span {
            display: block;
            padding: 8px 12px;
            font-size: 13px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
